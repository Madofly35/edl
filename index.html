 linear-gradient(to right,transparent calc(33.33% - .5px),rgba(255,255,255,.22) calc(33.33% - .5px),rgba(255,255,255,.22) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.22) calc(66.66% - .5px),rgba(255,255,255,.22) calc(66.66% + .5px),transparent calc(66.66% + .5px)),
 linear-gradient(to bottom,transparent calc(33.33% - .5px),rgba(255,255,255,.22) calc(33.33% - .5px),rgba(255,255,255,.22) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.22) calc(66.66% - .5px),rgba(255,255,255,.22) calc(66.66% + .5px),transparent calc(66.66% + .5px))}

<body>
<div id="app"></div>
<script>
"use strict";
/* =====================================================================
   État des lieux autonome — web app mono-fichier
   - ?room=ID      → charge rooms/ID.json (pack de référence)
   - ?r=URL        → charge un pack depuis une URL (CORS)
   - ?admin        → créer un pack de référence
   - ?test         → teste le dernier pack créé en mode admin (stocké localement)
   Aucun serveur requis : tout est traité sur le téléphone, le locataire
   envoie le rapport PDF + ZIP via le menu de partage (WhatsApp, mail…).
   ===================================================================== */

const DEFAULT_SHOTS = [
  ["Vue d'ensemble depuis la porte","Placez-vous dans l'encadrement de la porte"],
  ["Vue d'ensemble vers la porte","Dos à la fenêtre, cadrez la porte et les murs"],
  ["Fenêtre et volet","Cadrez toute la fenêtre"],
  ["Lit et matelas","Retirez la couette si possible"],
  ["Bureau et chaise",""],
  ["Placard / armoire ouvert","Ouvrez les portes"],
  ["Sol","Photo vers le bas, vue large"],
  ["Plafond et luminaire",""],
  ["Porte de la chambre (intérieur)",""]
];
const DEFAULT_EQUIP = [
  ["Détecteur de fumée","Appuyez 3 secondes sur le bouton : il doit biper fort",true],
  ["Éclairage de la chambre","Allumez chaque lumière",false],
  ["Prises électriques","Testez avec un chargeur de téléphone",false],
  ["Chauffage / radiateur","Il doit chauffer après quelques minutes",false],
  ["Fenêtre et volet","Ouverture, fermeture, verrouillage",false],
  ["Serrure et clé de la chambre","La clé ferme et ouvre la porte",false],
  ["Mobilier (lit, bureau, chaise, rangement)","Stable et complet",false]
];
/* Propreté (état des lieux de SORTIE) : [libellé, conseil, obligatoire, mots-clés attendus pour l'IA]
   Les mots-clés sont cherchés dans les classes ImageNet renvoyées par MobileNet. */
const DEFAULT_CLEAN = [
  ["Four — intérieur","Porte ouverte, grille visible, sans graisse ni résidus",true,"oven|stove|microwave|rotisserie|dutch oven|fire screen|safe|printer|dishwasher"],
  ["Micro-ondes — intérieur","Porte ouverte, plateau visible",false,"microwave|oven"],
  ["Plaques de cuisson","Vue de dessus, plaques froides",true,"stove|oven|frying pan|wok|spatula|caldron"],
  ["Hotte et filtre","Filtre propre, sans graisse",false,"hood|stove|oven|cabinet|lamp"],
  ["Réfrigérateur — intérieur","Vidé, clayettes visibles",true,"refrigerator|icebox|freezer|cabinet|china cabinet"],
  ["Lave-vaisselle — intérieur","Paniers sortis, filtre visible",true,"dishwasher|dish washer|dishrag|plate rack|washer"],
  ["Évier et robinetterie","Sans calcaire ni vaisselle",true,"washbasin|sink|basin|faucet|tub|soap dispenser|plate rack"],
  ["Toilettes","Abattant levé, cuvette visible",true,"toilet|bathtub|washbasin|tub"],
  ["Lavabo","Sans calcaire ni cheveux",true,"washbasin|sink|basin|faucet|medicine chest|soap dispenser"],
  ["Douche / baignoire","Joints et paroi visibles",true,"shower|bathtub|tub|curtain|washbasin"],
  ["Sol de la chambre","Vue large, aspiré et lavé",true,""],
  ["Placard / armoire vidé","Portes ouvertes, étagères vides",true,"wardrobe|closet|cabinet|chest|bookcase|sliding door|file"],
  ["Poubelles","Vidées et propres",false,"ashcan|trash|bucket|pail|barrel|ash can"]
];

/* ---------------- utilitaires ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const slug = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40) || "x";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const fmtDate = d => new Date(d).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
function toast(msg, ms=2200){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }
const urlCache = new WeakMap();
function blobUrl(b){ if(!b) return ""; if(!urlCache.has(b)) urlCache.set(b, URL.createObjectURL(b)); return urlCache.get(b); }
function vibrate(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }
function canvasToBlob(c, q=.86){ return new Promise(r => c.toBlob(r, "image/jpeg", q)); }
function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); if(/^https?:/.test(src) && !src.startsWith(location.origin)) i.crossOrigin = "anonymous"; i.onload = () => res(i); i.onerror = () => rej(new Error("Image introuvable : " + String(src).slice(0,80))); i.src = src; }); }
async function blobToImg(b){ return loadImg(blobUrl(b)); }
/** redimensionne une image (élément) → canvas, côté long ≤ max */
function imgToCanvas(img, max){ const w=img.naturalWidth||img.width, h=img.naturalHeight||img.height; const k=Math.min(1, max/Math.max(w,h)); const c=document.createElement("canvas"); c.width=Math.round(w*k); c.height=Math.round(h*k); const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height); return c; }
async function fileToJpeg(file, max=1600, q=.86){ const img = await loadImg(URL.createObjectURL(file)); return canvasToBlob(imgToCanvas(img, max), q); }
const blobToDataURL = b => new Promise(r => { const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(b); });

/* ---------------- stockage local (reprise si l'appli est fermée) ---------------- */
const idb = (() => {
  let dbp;
  const db = () => dbp || (dbp = new Promise((res, rej) => { const r = indexedDB.open("edl", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  const tx = async (mode, fn) => { const d = await db(); return new Promise((res, rej) => { const t = d.transaction("kv", mode); const s = t.objectStore("kv"); const q = fn(s); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); };
  return { get: k => tx("readonly", s => s.get(k)), set: (k, v) => tx("readwrite", s => s.put(v, k)), del: k => tx("readwrite", s => s.delete(k)) };
})();

/* ---------------- état ---------------- */
const S = { pack:null, sess:null, refImgs:{}, matchers:{} };
async function save(){ try{ await idb.set(S.sessKey || ("sess:" + S.pack.id), S.sess); }catch(e){ console.warn(e); } }

function normalizePack(p){
  p = p || {};
  const refs = (p.refs && p.refs.length ? p.refs : DEFAULT_SHOTS.map(([label,hint]) => ({label,hint})))
    .map((r,i) => ({ id: r.id || ("p" + String(i+1).padStart(2,"0")), label: r.label || ("Photo " + (i+1)), hint: r.hint || "", src: r.src || null }));
  const eq = (p.equipements && p.equipements.length ? p.equipements : DEFAULT_EQUIP.map(([label,hint,required]) => ({label,hint,required})))
    .map((e,i) => typeof e === "string" ? { id:"e"+i, label:e.replace(/^\*\s*/,""), hint:"", required:/^\*/.test(e) } : { id: e.id || ("e"+i), label:e.label, hint:e.hint||"", required:!!e.required });
  const q = new URLSearchParams(location.search);
  const mode = q.has("sortie") ? "sortie" : q.has("entree") ? "entree" : (p.mode === "sortie" ? "sortie" : "entree");
  const cleanAll = (p.proprete && p.proprete.length ? p.proprete : DEFAULT_CLEAN.map(([label,hint,required,ai]) => ({label,hint,required,ai})))
    .map((c,i) => typeof c === "string" ? { id:"c"+String(i+1).padStart(2,"0"), label:c.replace(/^\*\s*/,""), hint:"", required:/^\*/.test(c), ai:"" }
                                         : { id: c.id || ("c"+String(i+1).padStart(2,"0")), label:c.label, hint:c.hint||"", required:!!c.required, ai:c.ai||"", src:c.src||null });
  const clean = mode === "sortie" ? cleanAll : [];
  return { id: p.id || "sans-reference", logement: p.logement || "", chambre: p.chambre || "", adresse: p.adresse || "",
           proprietaire: p.proprietaire || "BP IMMO", contact: p.contact || {}, refs, equipements: eq, hasRefs: refs.some(r => r.src), source: p.source || "",
           mode, proprete: clean, propreteRef: cleanAll, rentila: p.rentila || {} };
}
const isExit = () => S.pack.mode === "sortie";
const edlName = () => isExit() ? "État des lieux de sortie" : "État des lieux d'entrée";
const logoBar = () => `<div class="logo"><img src="assets/mark.png" alt=""><span>BP IMMO</span><i></i></div>`;

/* =====================================================================
   INTELLIGENCE EMBARQUÉE (100 % sur le téléphone)
   1. Qualité : netteté (variance du laplacien), exposition, comparée à la référence.
   2. Cohérence de vue : corrélation de contours avec la photo de référence (moteur
      d'alignement) + similarité sémantique MobileNet (embeddings, cosinus).
   3. Objet attendu (propreté) : classification MobileNet (ImageNet) vs mots-clés.
   MobileNet est chargé à la demande ; s'il ne charge pas (réseau), seules les
   vérifications 1 et 2-contours s'appliquent. Rien n'est bloquant : le locataire
   peut toujours « Garder quand même », et le verdict est consigné dans le rapport.
   ===================================================================== */
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.async = true; s.onload = res; s.onerror = () => rej(new Error("script " + src)); document.head.appendChild(s); }); }
const AI = {
  p: null, model: null,
  load(){
    if(this.p) return this.p;
    this.p = (async () => {
      if(!window.tf) await loadScript("https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js");

/** netteté / exposition sur une version 256 px de l'image */
function imgStats(img){
  const c = imgToCanvas(img, 256), w = c.width, h = c.height, g = grayFrom(c.getContext("2d"), w, h);
  let m = 0, dark = 0, bright = 0; for(const v of g){ m += v; if(v < 25) dark++; if(v > 245) bright++; } m /= g.length;
  let s = 0, s2 = 0, n = 0;
  for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){ const i = y*w+x; const l = 4*g[i] - g[i-1] - g[i+1] - g[i-w] - g[i+w]; s += l; s2 += l*l; n++; }
  return { mean: m, sharp: s2/n - (s/n)**2, dark: dark/g.length, bright: bright/g.length };
}
const refStatsCache = {}, refEmbCache = {};
/**
 * Analyse une photo prise. ref = { key, img } (photo de référence), expect = "mots|clés" (propreté)
 * Renvoie { level:"ok"|"warn"|"bad", msgs:[…], sharp, mean, sim, emb, labels }
 */
async function analyzeShot(blob, { ref = null, expect = "", edgeScore = null, auto = false } = {}){
  const img = await blobToImg(blob), st = imgStats(img), msgs = [], out = { sharp: Math.round(st.sharp), mean: Math.round(st.mean) };
  let level = "ok";
  const warn = (m, l = "warn") => { msgs.push(m); if(l === "bad" || level === "ok") level = l; };
  // 1. qualité
  let rs = null; if(ref && ref.img){ rs = refStatsCache[ref.key] || (refStatsCache[ref.key] = imgStats(ref.img)); }
  const blurLimit = rs ? Math.min(90, rs.sharp * .30) : 35;
  if(st.mean < 45 || st.dark > .55) warn("Photo trop sombre : allumez la lumière ou ouvrez les volets.");
  else if(st.mean > 228 || st.bright > .45) warn("Photo surexposée (contre-jour ?) : changez d'angle.");
  if(st.sharp < blurLimit) warn("Photo floue : tenez le téléphone immobile et refaites-la.", "bad");
  // 2. cohérence avec la référence
  if(ref && ref.img){
    if(edgeScore != null) out.edge = Math.round(edgeScore*100)/100;
    const [e1, e2] = await Promise.all([ refEmbCache[ref.key] || AI.embed(ref.img).then(e => (refEmbCache[ref.key] = e)), AI.embed(img) ]);
    const sim = AI.cos(e1, e2); if(sim != null) out.sim = Math.round(sim*100)/100;
    if(!auto){
      const edgeBad = edgeScore != null && edgeScore < .15;
      if(sim != null ? (sim < .45 || (sim < .55 && edgeBad)) : edgeBad) warn("Cette photo ne ressemble pas à la vue de référence : vérifiez que vous êtes au bon endroit.", "bad");
    }
  }
  // 3. objet attendu
  if(expect){
    const preds = await AI.classify(img);
    if(preds){ out.labels = preds.slice(0,5).map(p => p.className.split(",")[0] + " " + Math.round(p.probability*100) + "%");
      const re = new RegExp(expect, "i"), hit = preds.some(p => re.test(p.className));
      out.match = hit; if(!hit) warn("L'appli ne reconnaît pas clairement l'élément demandé. Vérifiez le cadrage (élément entier, bien éclairé).");
    }
  }
  out.ai = !!AI.model; out.level = level; out.msgs = msgs; return out;
}

function showVerdict(blob, res){
  if(!res || res.level === "ok") return Promise.resolve(true);
  return new Promise(resolve => {
    const d = document.createElement("div"); d.className = "verdict";

}

/* =====================================================================
   MOTEUR D'ALIGNEMENT
   Compare le flux caméra à la photo de référence (contours, basse résolution)
   et estime : décalage horizontal / vertical + distance (zoom).
   ===================================================================== */
const MATCH_MAX = 64, MARGIN = 8, SCALES = [0.86, 0.93, 1, 1.07, 1.15];
function grayFrom(ctx, w, h){ const d = ctx.getImageData(0,0,w,h).data, g = new Float32Array(w*h); for(let i=0,j=0;i<g.length;i++,j+=4) g[i] = .299*d[j] + .587*d[j+1] + .114*d[j+2]; return g; }
function edges(g, w, h){
  const b = new Float32Array(w*h), e = new Float32Array(w*h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ let s=0,n=0; for(let v=-1;v<=1;v++){ const yy=y+v; if(yy<0||yy>=h) continue; for(let u=-1;u<=1;u++){ const xx=x+u; if(xx<0||xx>=w) continue; s+=g[yy*w+xx]; n++; } } b[y*w+x]=s/n; }
  for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){ const i=y*w+x;
    const gx = b[i-w+1]+2*b[i+1]+b[i+w+1]-b[i-w-1]-2*b[i-1]-b[i+w-1];
    const gy = b[i+w-1]+2*b[i+w]+b[i+w+1]-b[i-w-1]-2*b[i-w]-b[i-w+1];
    e[i] = Math.sqrt(Math.sqrt(gx*gx+gy*gy)); }
  return e;
}
function resample(g2, w2, h2, w, h, s){
  const out = new Float32Array(w*h), cx = w2/2, cy = h2/2;
  for(let y=0;y<h;y++){ const fy = cy + ((y+.5) - h/2)*2*s - .5; const y0=Math.max(0,Math.min(h2-2,Math.floor(fy))), ty=Math.max(0,Math.min(1,fy-y0));
    for(let x=0;x<w;x++){ const fx = cx + ((x+.5) - w/2)*2*s - .5; const x0=Math.max(0,Math.min(w2-2,Math.floor(fx))), tx=Math.max(0,Math.min(1,fx-x0)); const i=y0*w2+x0;
      out[y*w+x] = (g2[i]*(1-tx)+g2[i+1]*tx)*(1-ty) + (g2[i+w2]*(1-tx)+g2[i+w2+1]*tx)*ty; } }
  return out;
}
class Matcher{
  constructor(img){
    const W = img.naturalWidth, H = img.naturalHeight; this.aspect = W/H;
    if(this.aspect >= 1){ this.w = MATCH_MAX; this.h = Math.round(MATCH_MAX/this.aspect); } else { this.h = MATCH_MAX; this.w = Math.round(MATCH_MAX*this.aspect); }
    const c = document.createElement("canvas"); c.width = this.w; c.height = this.h; const x = c.getContext("2d", {willReadFrequently:true}); x.drawImage(img, 0, 0, this.w, this.h);
    const E = edges(grayFrom(x, this.w, this.h), this.w, this.h);
    // fenêtre centrale normalisée (moyenne nulle, norme 1)
    let s=0, n=0; for(let y=MARGIN;y<this.h-MARGIN;y++) for(let xx=MARGIN;xx<this.w-MARGIN;xx++){ s+=E[y*this.w+xx]; n++; }
    const m = s/n; let q = 0; const R = new Float32Array(this.w*this.h);
    for(let y=MARGIN;y<this.h-MARGIN;y++) for(let xx=MARGIN;xx<this.w-MARGIN;xx++){ const v = E[y*this.w+xx]-m; R[y*this.w+xx]=v; q+=v*v; }
    q = Math.sqrt(q) || 1; for(let i=0;i<R.length;i++) R[i]/=q; this.R = R; this.n = n;
  }
  /** g2 : niveaux de gris du flux caméra à 2× la résolution de travail */
  match(g2){
    const {w,h,R,n} = this; let best = {score:-2, dx:0, dy:0, s:1};
    for(const s of SCALES){
      const E = edges(resample(g2, w*2, h*2, w, h, s), w, h);
      for(let dy=-MARGIN; dy<=MARGIN; dy++) for(let dx=-MARGIN; dx<=MARGIN; dx++){
        let sum=0, sl=0, sl2=0;
        for(let y=MARGIN;y<h-MARGIN;y++){ const ry=y*w, ly=(y+dy)*w+dx; for(let x=MARGIN;x<w-MARGIN;x++){ const l=E[ly+x]; sum+=R[ry+x]*l; sl+=l; sl2+=l*l; } }
        const v = sl2 - sl*sl/n; let sc = v > 1e-6 ? sum/Math.sqrt(v) : 0;
        sc -= 0.003*(Math.abs(dx)+Math.abs(dy)) + 0.04*Math.abs(Math.log(s));   // favorise la position neutre
        if(sc > best.score) best = {score:sc, dx, dy, s};
      }
    }
    best.dxF = best.dx / w; best.dyF = best.dy / h; return best;
  }
}

  const cam = CAM = { on:true, hold:0, prev:null, ema:null, t0:performance.now(), ghost:true };
  $("#cx").onclick = () => single ? renderReview() : renderHub();
  $("#gh").onclick = () => { cam.ghost = !cam.ghost; $("#gh").classList.toggle("on", cam.ghost); const g=$("#go"); if(g) g.style.opacity = cam.ghost ? .45 : 0; };

  // image de référence + moteur
  let refImg = null, matcher = null;
  if(ref.src){
    try{ refImg = S.refImgs[ref.id] || (S.refImgs[ref.id] = await loadImg(ref.src)); matcher = S.matchers[ref.id] || (S.matchers[ref.id] = new Matcher(refImg)); }
    catch(e){ console.warn(e); }
  }
  if(cam !== CAM) return;
  const aspect = refImg ? refImg.naturalWidth / refImg.naturalHeight : 3/4;
  const layout = () => { const sb = $("#sb"); if(!sb) return; const W = sb.clientWidth - 8, H = sb.clientHeight - 8; let w = W, h = W/aspect; if(h > H){ h = H; w = H*aspect; } const st=$("#st"); st.style.width = w+"px"; st.style.height = h+"px";
    const portraitScreen = innerHeight > innerWidth; $("#rot").classList.toggle("show", refImg && ((aspect > 1.15 && portraitScreen) || (aspect < .87 && !portraitScreen))); };
  layout(); addEventListener("resize", layout); cam.cleanup = () => removeEventListener("resize", layout);

  // caméra
  const vd = $("#vd");
  try{
    cam.stream = await navigator.mediaDevices.getUserMedia({ audio:false, video:{ facingMode:{ideal:"environment"}, width:{ideal:1920}, height:{ideal:1440} } });
    if(cam !== CAM){ cam.stream.getTracks().forEach(t=>t.stop()); return; }
    vd.srcObject = cam.stream; await vd.play().catch(()=>{});
  }catch(e){ return cameraFallback(idx, single, e); }

  const doCapture = async (auto, score) => {
    if(cam.busy) return; cam.busy = true;
    const vw = vd.videoWidth, vh = vd.videoHeight; let cw = vw, ch = vw/aspect; if(ch > vh){ ch = vh; cw = vh*aspect; }
    const k = Math.min(1, 1600/Math.max(cw,ch)); const c = document.createElement("canvas"); c.width = Math.round(cw*k); c.height = Math.round(ch*k);
    c.getContext("2d").drawImage(vd, (vw-cw)/2, (vh-ch)/2, cw, ch, 0, 0, c.width, c.height);
    const blob = await canvasToBlob(c, .88);
    $("#fl").classList.remove("go"); void $("#fl").offsetWidth; $("#fl").classList.add("go"); vibrate(auto ? [40,40,40] : 50);
    // contrôle de cohérence : la caméra reste ouverte pendant l'analyse
    $("#hn").textContent = "Vérification de la photo…"; $("#hn").className = "hint";
    const check = await analyzeShot(blob, { ref: refImg ? { key: p.id + ref.id, img: refImg } : null, edgeScore: score, auto: !!auto });
    if(cam !== CAM) return;
    if(!(await showVerdict(blob, check))){ cam.busy = false; cam.hold = 0; cam.t0 = performance.now(); cam.prev = null; if(auto && cam.restart) cam.restart(); return; }   // refaire : on reste sur la même vue
    s.shots[ref.id] = { blob, ts: Date.now(), auto: !!auto, score: score != null ? Math.round(score*100)/100 : null, check };
    await save();
    $("#ok").classList.add("show"); await sleep(650);
    if(cam !== CAM) return;
    if(single) return renderReview();
    const next = p.refs.findIndex((r,i) => i > idx && !s.shots[r.id]); const any = p.refs.findIndex(r => !s.shots[r.id]);
    (next >= 0) ? startCapture(next) : (any >= 0 ? startCapture(any) : renderReview());
  };
  $("#sh").onclick = () => doCapture(false, cam.last ? cam.last.score : null);
  if(!matcher) return; // pas de référence : déclenchement manuel

  // boucle d'analyse
  const mw = matcher.w*2, mh = matcher.h*2; const cv = document.createElement("canvas"); cv.width = mw; cv.height = mh; const cx = cv.getContext("2d", {willReadFrequently:true});
  const hn = $("#hn"), dt = $("#dt"), arc = $("#arc"), st = $("#st"), sh = $("#sh");
  let lastT = performance.now();
  const tick = () => {
    if(!cam.on || cam !== CAM) return;
    const now = performance.now(), dtm = now - lastT; lastT = now;
    if(vd.readyState >= 2 && vd.videoWidth && !cam.busy){
      const vw = vd.videoWidth, vh = vd.videoHeight; let cw = vw, ch = vw/aspect; if(ch > vh){ ch = vh; cw = vh*aspect; }
      cx.drawImage(vd, (vw-cw)/2, (vh-ch)/2, cw, ch, 0, 0, mw, mh);
      const g = grayFrom(cx, mw, mh);
      let motion = 99; if(cam.prev){ let d=0; for(let i=0;i<g.length;i+=3) d += Math.abs(g[i]-cam.prev[i]); motion = d/(g.length/3); } cam.prev = g;
      const r = matcher.match(g); cam.last = r;
      const e = cam.ema = cam.ema ? { dx: cam.ema.dx*.5 + r.dxF*.5, dy: cam.ema.dy*.5 + r.dyF*.5 } : { dx:r.dxF, dy:r.dyF };
      const lost = r.score < 0.18;
      const centered = Math.abs(r.dx) <= 1 && Math.abs(r.dy) <= 1;
      const distOk = r.s >= 0.93 && r.s <= 1.07;
      const steady = motion < 7;
      const aligned = !lost && centered && distOk && r.score >= 0.28;
      // pastille : la déplacer dans le cercle en bougeant le téléphone
      const W = st.clientWidth, H = st.clientHeight, lim = Math.min(W,H)*.42;
      let px = e.dx*W*2.6, py = e.dy*H*2.6; const m = Math.hypot(px,py); if(m > lim){ px*=lim/m; py*=lim/m; }
      dt.style.opacity = lost ? 0 : 1; dt.style.transform = `translate(${px}px,${py}px)`; dt.classList.toggle("ok", aligned);
      let msg, cls = "warn";
      if(lost) msg = "Cherchez la vue de la photo fantôme 👀";
      else if(!centered){ const ax = Math.abs(r.dxF) >= Math.abs(r.dyF); msg = ax ? (r.dx > 0 ? "Tournez vers la droite →" : "← Tournez vers la gauche") : (r.dy > 0 ? "Inclinez vers le bas ↓" : "↑ Inclinez vers le haut"); }
      else if(!distOk) msg = r.s < 1 ? "Avancez d'un pas ⬆" : "Reculez d'un pas ⬇";   // s<1 : la vue est trop large → trop loin
      else if(r.score < 0.28) msg = "Presque… ajustez doucement";
      else if(!steady) msg = "Ne bougez plus…";
      else { msg = "Parfait, ne bougez plus ✋"; cls = "ok"; }
      hn.textContent = msg; hn.className = "hint " + cls;
      cam.hold = (aligned && steady) ? cam.hold + dtm : Math.max(0, cam.hold - dtm*2);
      arc.setAttribute("stroke-dashoffset", 226 * (1 - Math.min(1, cam.hold/700)));
      if(cam.hold >= 700) { doCapture(true, r.score); return; }
      sh.classList.toggle("pulse", now - cam.t0 > 25000);
      if(now - cam.t0 > 25000 && !aligned) hn.textContent = msg + " — ou appuyez sur le bouton";
    }
    cam.timer = setTimeout(tick, 70);
  };
  cam.restart = () => { clearTimeout(cam.timer); tick(); };
  tick();
}

function cameraFallback(idx, single, err){
  const p = S.pack, ref = p.refs[idx], s = S.sess;
  stopCam();
  app.innerHTML = `<div class="cam"><div class="ctop"><button class="rb" id="cx">✕</button><div class="ttl">Photo ${idx+1} / ${p.refs.length}<b>${esc(ref.label)}</b></div><span style="width:44px"></span></div>
  <div class="camfail"><p>⚠️ Le guidage caméra n'est pas disponible ici${err && err.name==="NotAllowedError" ? " (accès caméra refusé)" : ""}.<br><small>Astuce : ouvrez le lien dans <b>Safari</b> ou <b>Chrome</b> et autorisez la caméra.</small></p>
  ${ref.src ? `<p>Reprenez la même vue que celle-ci :</p><img src="${esc(ref.src)}">` : `<p>${esc(ref.hint)}</p>`}
  <label class="btn" style="margin-top:14px">📷 Prendre la photo<input type="file" accept="image/*" capture="environment" id="fi" hidden></label>
  <div style="height:10px"></div><button class="btn ghost" id="rt" style="color:#fff">Réessayer la caméra guidée</button></div></div>`;
  $("#cx").onclick = () => single ? renderReview() : renderHub();
  $("#rt").onclick = () => startCapture(idx, single);
  $("#fi").onchange = async ev => { const f = ev.target.files[0]; if(!f) return; toast("Vérification…", 1200); const blob = await fileToJpeg(f);
    let refImg = null; try{ if(ref.src) refImg = S.refImgs[ref.id] || (S.refImgs[ref.id] = await loadImg(ref.src)); }catch(e){}
    const check = await analyzeShot(blob, { ref: refImg ? { key: p.id + ref.id, img: refImg } : null });
    if(!(await showVerdict(blob, check))) return;
    s.shots[ref.id] = { blob, ts: Date.now(), auto:false, score:null, check }; await save(); toast("Photo enregistrée ✓");
    if(single) return renderReview(); const next = p.refs.findIndex(r => !s.shots[r.id]); next >= 0 ? cameraFallback(next, false, err) : renderReview(); };
}

function certText(){ const p = S.pack, s = S.sess;
  return `Je soussigné(e) ${s.tenant}, locataire de « ${p.chambre}${p.logement ? " — " + p.logement : ""} », certifie avoir réalisé moi-même les photos de cet état des lieux ${isExit() ? "de sortie" : "d'entrée"} le ${fmtDate(s.signedAt || Date.now())}, et qu'elles reflètent fidèlement l'état${isExit() ? " et la propreté" : ""} de la chambre à ${isExit() ? "ma sortie" : "mon entrée"}. Je reconnais que le détecteur de fumée et les équipements indiqués « Fonctionne » sont en bon état de marche, les problèmes constatés étant décrits ci-dessus. Ce document est préparatoire : l'état des lieux officiel sera signé électroniquement par le bailleur et moi-même sur Rentila (e-mail + code SMS).`; }
/* e-mail et mobile du locataire : indispensables pour l'invitation à signer sur Rentila */
const okEmail = v => /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(v);
function toE164(v){ let t = String(v||"").replace(/[\s.\-()]/g, ""); if(t.startsWith("00")) t = "+" + t.slice(2); if(/^0[1-9]\d{8}$/.test(t)) t = "+33" + t.slice(1); return /^\+\d{8,15}$/.test(t) ? t : null; }
function renderFinish(){

  view(`<div class="wrap"><div class="brand">Étape 4</div><h1>Valider et envoyer</h1>
  <div class="card"><b>Récapitulatif</b><p class="sub" style="margin:6px 0 0">${shotsDone()} photos de la chambre · ${s.details.length} photo(s) de défauts · ${p.equipements.filter(e => s.equip[e.id].ok===false).length} problème(s) d'équipement signalé(s)${isExit() ? ` · ${cleanDone()} photo(s) de propreté (${p.proprete.filter(c => (s.clean[c.id]||{}).ok === false).length} à reprendre)` : ""}</p></div>
  <div class="card"><b>✍️ Signature officielle sur Rentila</b><p class="sub" style="margin:6px 0 0">Votre propriétaire reprend ce rapport dans <b>Rentila</b>, le logiciel de gestion du bail. Vous recevrez un <b>e-mail de Rentila</b> avec un lien pour signer l'état des lieux officiel, confirmé par un <b>code SMS</b>. C'est cette signature qui a valeur légale.</p>
  <label class="f" for="em">Votre e-mail</label><input type="email" id="em" autocomplete="email" inputmode="email" value="${esc(s.email||"")}" placeholder="prenom.nom@exemple.fr">
  <label class="f" for="ph">Votre mobile (pour le code SMS)</label><input type="tel" id="ph" autocomplete="tel" inputmode="tel" value="${esc(s.phone||"")}" placeholder="06 12 34 56 78"></div>
  <label class="check card"><input type="checkbox" id="ac" ${s.accepted?"checked":""}><span>${esc(certText())}</span></label>
  <label class="f">Votre visa (paraphe) avec le doigt</label><canvas id="sig"></canvas><button class="mini" id="clr" style="margin-top:8px">Effacer</button>
  <div class="err" id="er"></div></div>
  <div class="bar"><div class="in"><button class="btn" id="go">Valider et envoyer</button></div></div>`);
  $("#em").onchange = () => { s.email = $("#em").value.trim(); save(); };
  $("#ph").onchange = () => { s.phone = $("#ph").value.trim(); save(); };
  const c = $("#sig"), r = c.getBoundingClientRect(), dpr = devicePixelRatio || 1; c.width = r.width*dpr; c.height = r.height*dpr;
  const x = c.getContext("2d"); x.scale(dpr,dpr); x.lineWidth = 2.6; x.lineCap = x.lineJoin = "round"; x.strokeStyle = "#0f172a";
  let drawing = false, inked = false;
  if(s.signature){ loadImg(s.signature).then(i => x.drawImage(i, 0, 0, r.width, r.height)); inked = true; }
  const pt = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.onpointerdown = e => { drawing = true; inked = true; c.setPointerCapture(e.pointerId); const [a,b] = pt(e); x.beginPath(); x.moveTo(a,b); };
  c.onpointermove = e => { if(!drawing) return; const [a,b] = pt(e); x.lineTo(a,b); x.stroke(); };
  c.onpointerup = c.onpointercancel = () => { drawing = false; };
  $("#clr").onclick = () => { x.clearRect(0,0,c.width,c.height); inked = false; s.signature = null; };

function rentilaPayload(d){
  const p = S.pack, date = d.signature.slice(0,10), clip = (t, n=255) => String(t||"").slice(0, n);

  const rooms = [{
    name: p.chambre || "Chambre",
    note: [d.remarques, defautsTxt].filter(Boolean).join("\n\n") || "Conforme aux photos.",
    furniture: d.equipements.map((e,i) => ({ item: clip(e.label), element: 0, order_id: i, operation: e.ok === false ? 1 : 0, wear_state: e.ok === false ? 4 : e.ok ? 2 : 0, comments: clip(e.commentaire) })),
    _photos: d.photos.filter(x => x.fichier).map(x => x.fichier).concat(d.defauts.map(x => x.fichier))
  }];
  if(d.type === "sortie" && d.proprete.some(c => c.fichier)) rooms.push({
    name: "Propreté",
    note: d.proprete.filter(c => c.propre === false).map(c => `À reprendre — ${c.label}${c.commentaire ? " : " + c.commentaire : ""}`).join("\n") || "Logement rendu propre.",

    _photos: d.proprete.filter(c => c.fichier).map(c => c.fichier)
  });
  const flagged = d.photos.concat(d.proprete).filter(x => x.controle && x.controle.niveau !== "ok").map(x => `${x.label} : ${x.controle.messages.join(" ")}`);
  return {
    handover_type: d.type === "sortie" ? "exit" : "enter",
    lease_id: +(p.rentila.lease_id || 0) || null,
    name: clip(`${p.logement ? p.logement + " " : ""}${p.chambre} — ${d.locataire} — ${d.type === "sortie" ? "sortie" : "entrée"} ${date}`),
    draft: 1,
    _signataire: { nom: d.locataire, email: d.locataireEmail || null, mobile: d.locataireMobile || null },
    observations: [`Photos et constats réalisés par le locataire (${d.locataire}) avec l'application BP Immo le ${fmtDate(d.signature)} et visés par lui dans l'application. Le présent état des lieux, signé électroniquement sur Rentila par le bailleur et le locataire, fait foi.`,

    data: d.type === "sortie" && d.clesRendues ? [{ data_type: "key", count: String(d.clesRendues), date, comments: "Clés rendues par le locataire" }] : [],
    rooms

}

      const ih = Math.min(230, cw*im.h/im.w), iw = ih*im.w/im.h; ensure(ih + 60);
      pdf.text(`${i+1}. ${c.label}`, M, y+11, 11, true); pdf.text(v.ok === false ? "À REPRENDRE" : v.ok ? "Propre" : "—", M + CW - 80, y+11, 10, true, v.ok === false ? RED : GRN); y += 18;
      if(oi){ const oh = Math.min(230, cw*oi.h/oi.w); pdf.img(oi, M, y, oh*oi.w/oi.h, oh); pdf.img(im, M + cw + 14, y, iw, ih); pdf.text("Entrée", M, y+Math.max(ih,oh)+11, 8, false, MUT); pdf.text("Sortie — " + fmtDate(v.ts), M+cw+14, y+Math.max(ih,oh)+11, 8, false, MUT); y += Math.max(ih,oh) + 16; }
      else { pdf.img(im, M, y, iw, ih); let ty = y + 10; const tx = M + iw + 14, tw = CW - iw - 14;
        for(const l of wrap(fmtDate(v.ts), 8, tw)){ pdf.text(l, tx, ty, 8, false, MUT); ty += 11; }
        if(v.comment) for(const l of wrap(v.comment, 10, tw)){ pdf.text(l, tx, ty+4, 10); ty += 14; }
        if(v.check) for(const l of wrap(aiNote(v.check), 8, tw)){ pdf.text(l, tx, ty+8, 8, false, v.check.level === "ok" ? GRN : ORA); ty += 10; }
        y += Math.max(ih, ty - y) + 6; }
      if(oi){ if(v.comment) para(v.comment, 10); if(v.check) para(aiNote(v.check), 8, false, v.check.level === "ok" ? GRN : ORA); }
      y += 12; } }
  // défauts
  if(s.details.length){ header("Défauts et détails signalés");
    for(let i=0;i<s.details.length;i++){ const d = s.details[i]; progress(`Défauts ${i+1}/${s.details.length}…`); const im = await jpegFor(pdf, d.blob, 900);
      const iw = 200, ih = Math.min(260, iw*im.h/im.w), iw2 = ih*im.w/im.h; ensure(ih + 20);
      pdf.img(im, M, y, iw2, ih); let ty = y + 12; const tx = M + 215, tw = CW - 215;
      pdf.text(`Défaut ${i+1}${d.where ? " — " + d.where : ""}`, tx, ty, 11, true); ty += 16; pdf.text(fmtDate(d.ts), tx, ty, 8, false, MUT); ty += 16;
      for(const l of wrap(d.comment || "(pas de commentaire)", 10, tw)){ pdf.text(l, tx, ty, 10); ty += 14; }
      y += Math.max(ih, ty - y) + 18; } }
  // pieds de page
  pdf.pages.forEach((pg, i) => { pdf.cur = pg; pdf.text(`${base}  ·  page ${i+1}/${pdf.pages.length}`, M, pdf.H - 24, 7.5, false, MUT); });
  const pdfBlob = pdf.output();

  // ZIP : photos pleine résolution + rapport + pack de référence pour le prochain locataire
  progress("Préparation du ZIP…");
  const files = [{ name: base + ".pdf", data: await u8(pdfBlob) }];
  const nextRefs = [];
  for(let i=0;i<p.refs.length;i++){ const r = p.refs[i], sh2 = s.shots[r.id]; if(!sh2) continue; const n = String(i+1).padStart(2,"0") + "_" + slug(r.label) + ".jpg";
    files.push({ name: "photos/" + n, data: await u8(sh2.blob) });
    const small = await canvasToBlob(imgToCanvas(await blobToImg(sh2.blob), 1200), .8);
    nextRefs.push({ id: r.id, label: r.label, hint: r.hint, src: await blobToDataURL(small) }); }
  for(let i=0;i<s.details.length;i++){ const d = s.details[i]; files.push({ name: `defauts/${String(i+1).padStart(2,"0")}_${slug(d.where||"detail")}.jpg`, data: await u8(d.blob) }); }
  const cleanFiles = {};
  for(let i=0;i<p.proprete.length;i++){ const c = p.proprete[i], v = s.clean[c.id]; if(!v || !v.blob) continue; const n = `proprete/${String(i+1).padStart(2,"0")}_${slug(c.label)}.jpg`; cleanFiles[c.id] = n; files.push({ name: n, data: await u8(v.blob) }); }
  const ck = c => c ? { niveau: c.level, messages: c.msgs, nettete: c.sharp, luminosite: c.mean, ressemblance: c.sim ?? null, contours: c.edge ?? null, objets: c.labels || null, gardeeMalgre: !!c.forced } : null;
  const photoName = (r, i) => String(i+1).padStart(2,"0") + "_" + slug(r.label) + ".jpg";
  const data = { packId: p.id, type: p.mode, logement: p.logement, chambre: p.chambre, locataire: s.tenant, locataireEmail: s.email || null, locataireMobile: s.phone || null, debut: new Date(s.startedAt).toISOString(), signature: new Date(s.signedAt).toISOString(),
    photos: p.refs.map((r,i) => ({ id:r.id, label:r.label, fichier: s.shots[r.id] ? "photos/" + photoName(r,i) : null, prise: s.shots[r.id] ? new Date(s.shots[r.id].ts).toISOString() : null, cadrageAuto: !!(s.shots[r.id]||{}).auto, score:(s.shots[r.id]||{}).score, controle: ck((s.shots[r.id]||{}).check) })),
    proprete: p.proprete.map(c => { const v = s.clean[c.id] || {}; return { id:c.id, label:c.label, fichier: cleanFiles[c.id] || null, propre: v.ok ?? null, commentaire: v.comment || "", controle: ck(v.check) }; }),
    clesRendues: s.keys || null,
    defauts: s.details.map((d,i) => ({ ou:d.where, commentaire:d.comment, fichier:`defauts/${String(i+1).padStart(2,"0")}_${slug(d.where||"detail")}.jpg`, date:new Date(d.ts).toISOString(), controle: ck(d.check) })),
    equipements: p.equipements.map(e => ({ label:e.label, ok:(s.equip[e.id]||{}).ok, commentaire:(s.equip[e.id]||{}).comment || "" })), remarques: s.comment, userAgent: navigator.userAgent };
  files.push({ name: "donnees.json", data: new TextEncoder().encode(JSON.stringify(data, null, 2)) });
  files.push({ name: "rentila.json", data: new TextEncoder().encode(JSON.stringify(rentilaPayload(data), null, 2)) });
  const nextClean = [];
  for(const c of p.propreteRef){ const v = s.clean[c.id]; nextClean.push({ id:c.id, label:c.label, hint:c.hint, required:c.required, ai:c.ai, src: v && v.blob ? await blobToDataURL(await canvasToBlob(imgToCanvas(await blobToImg(v.blob), 900), .78)) : (c.src || null) }); }
  const nextPack = { id: p.id, mode: "entree", logement: p.logement, chambre: p.chambre, adresse: p.adresse, proprietaire: p.proprietaire, contact: p.contact, rentila: { property_id: p.rentila.property_id || null },
    source: `EDL ${isExit() ? "sortie" : "entrée"} ${s.tenant} du ${new Date(s.signedAt).toLocaleDateString("fr-FR")}`,
    refs: nextRefs, equipements: p.equipements.map(e => ({ label:e.label, hint:e.hint, required:e.required })), ...(nextClean.length ? { proprete: nextClean } : {}) };
  files.push({ name: `reference_prochain_locataire/${p.id}.json`, data: new TextEncoder().encode(JSON.stringify(nextPack)) });
  return { pdf: pdfBlob, zip: makeZip(files), base };
}

/* =====================================================================
   MODE PROPRIÉTAIRE : créer le pack de référence d'une chambre
   ===================================================================== */
async function renderAdmin(){
  const A = (await idb.get("admin:draft").catch(()=>null)) || { id:"", logement:"", chambre:"", adresse:"", proprietaire:"BP IMMO", email:"", whatsapp:"", nom:"", photos:[], equip: DEFAULT_EQUIP.map(([l,h,r]) => (r?"* ":"") + l + (h ? " | " + h : "")).join("\n") };
  A.mode = A.mode || "entree"; A.lease = A.lease || ""; A.property = A.property || "";
  if(A.clean == null) A.clean = DEFAULT_CLEAN.map(([l,h,r,ai]) => (r?"* ":"") + l + " | " + h + " | " + ai).join("\n");
  const saveA = () => idb.set("admin:draft", A).catch(()=>{});
  const draw = () => {
    view(`<div class="wrap">${logoBar()}<div class="brand">Mode propriétaire</div><h1>Créer la référence d'une chambre</h1>
    <div class="tip">Plus rapide : <code>python tools/drive_to_pack.py "BP2 CH4"</code> fabrique ce fichier directement depuis le Drive BP (photos HEIC comprises).</div>
    <p class="sub">Choisissez les photos globales du précédent état des lieux (dans l'ordre de prise de vue), donnez-leur un nom, puis téléchargez le fichier <b>.json</b> à déposer dans le dossier <code>rooms/</code> du site.</p>
    <div class="card">
     <label class="f">Identifiant (dans le lien)</label><input type="text" data-a="id" value="${esc(A.id)}" placeholder="ex. bp3-ch2-k7f4">
     <p class="sub" style="font-size:13px;margin:4px 0 0">Ajoutez quelques caractères aléatoires pour qu'il ne soit pas devinable.</p>
     <label class="f">Logement</label><input type="text" data-a="logement" value="${esc(A.logement)}" placeholder="ex. BP3 — 18 rue Édouard Herriot">
     <label class="f">Chambre</label><input type="text" data-a="chambre" value="${esc(A.chambre)}" placeholder="ex. Chambre 2">
     <label class="f">Adresse</label><input type="text" data-a="adresse" value="${esc(A.adresse)}" placeholder="13100 Aix-en-Provence">
     <label class="f">Propriétaire affiché</label><input type="text" data-a="proprietaire" value="${esc(A.proprietaire)}">
     <label class="f">Contact : nom / WhatsApp / e-mail</label>
     <input type="text" data-a="nom" value="${esc(A.nom)}" placeholder="Nom"><div style="height:6px"></div>
     <input type="text" data-a="whatsapp" value="${esc(A.whatsapp)}" placeholder="+33 6 …"><div style="height:6px"></div>
     <input type="text" data-a="email" value="${esc(A.email)}" placeholder="e-mail">
     <label class="f">Type d'état des lieux</label><select data-a="mode"><option value="entree" ${A.mode==="entree"?"selected":""}>Entrée</option><option value="sortie" ${A.mode==="sortie"?"selected":""}>Sortie (avec propreté)</option></select>
     <label class="f">Rentila : n° de bail / n° de bien (facultatif)</label>
     <input type="text" data-a="lease" value="${esc(A.lease)}" placeholder="ID du bail (ex. 1780351)" inputmode="numeric"><div style="height:6px"></div>
     <input type="text" data-a="property" value="${esc(A.property)}" placeholder="ID du bien (ex. 824575)" inputmode="numeric"></div>
    <h2 style="margin-top:20px">Photos de référence (${A.photos.length})</h2>
    <div class="pairs">${A.photos.map((ph,i) => `<div class="pair"><div style="display:grid;grid-template-columns:80px 1fr;gap:10px;align-items:start"><img src="${ph.src}" style="aspect-ratio:auto;height:100px;object-fit:cover">
      <div><input type="text" data-l="${i}" value="${esc(ph.label)}" style="padding:9px 10px;font-size:15px"><input type="text" data-h="${i}" value="${esc(ph.hint||"")}" placeholder="Conseil (facultatif)" style="padding:9px 10px;font-size:14px;margin-top:6px">
      <div style="display:flex;gap:6px;margin-top:6px"><button class="mini" data-up="${i}">↑</button><button class="mini" data-dn="${i}">↓</button><button class="mini red" data-rm="${i}">Retirer</button></div></div></div></div>`).join("")}</div>
    <label class="btn sec" style="margin-top:12px">＋ Ajouter des photos<input type="file" accept="image/*" multiple id="af" hidden></label>
    <h2 style="margin-top:22px">Équipements à vérifier</h2><p class="sub" style="font-size:14px">Un par ligne. « * » devant = obligatoire. « | » sépare le conseil.</p>
    <textarea id="eqt" style="min-height:180px;font-size:14px">${esc(A.equip)}</textarea>
    <h2 style="margin-top:22px">Propreté (sortie)</h2><p class="sub" style="font-size:14px">Un par ligne : « * » obligatoire · libellé | conseil | mots-clés IA (anglais, séparés par |).</p>
    <textarea id="clt" style="min-height:180px;font-size:13px">${esc(A.clean)}</textarea>
    <div class="err" id="er"></div></div>
    <div class="bar"><div class="in"><button class="btn sec" id="ts" style="flex:1">Tester</button><button class="btn" id="dl" style="flex:2">Télécharger le .json</button></div></div>`);
    app.querySelectorAll("[data-a]").forEach(i => i.oninput = () => { A[i.dataset.a] = i.value; saveA(); });
    app.querySelectorAll("[data-l]").forEach(i => i.oninput = () => { A.photos[+i.dataset.l].label = i.value; saveA(); });
    app.querySelectorAll("[data-h]").forEach(i => i.oninput = () => { A.photos[+i.dataset.h].hint = i.value; saveA(); });
    const mv = (i,d) => { const j = i+d; if(j<0||j>=A.photos.length) return; [A.photos[i],A.photos[j]] = [A.photos[j],A.photos[i]]; saveA(); draw(); };
    app.querySelectorAll("[data-up]").forEach(b => b.onclick = () => mv(+b.dataset.up,-1));
    app.querySelectorAll("[data-dn]").forEach(b => b.onclick = () => mv(+b.dataset.dn,1));
    app.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { A.photos.splice(+b.dataset.rm,1); saveA(); draw(); });
    $("#eqt").oninput = () => { A.equip = $("#eqt").value; saveA(); };
    $("#clt").oninput = () => { A.clean = $("#clt").value; saveA(); };
    $("#af").onchange = async ev => { const fs = [...ev.target.files]; toast("Import de " + fs.length + " photo(s)…");
      for(const f of fs){ const b = await fileToJpeg(f, 1200, .8); const n = A.photos.length; A.photos.push({ src: await blobToDataURL(b), label: (DEFAULT_SHOTS[n]||["Photo "+(n+1)])[0], hint: (DEFAULT_SHOTS[n]||[,""])[1] }); }
      await saveA(); draw(); };
    const build = () => { if(!A.id.trim() || !A.chambre.trim()) { $("#er").textContent = "Renseignez au moins l'identifiant et la chambre."; return null; }
      return { id: slug(A.id), mode: A.mode, logement: A.logement, chambre: A.chambre, adresse: A.adresse, proprietaire: A.proprietaire, contact: { nom:A.nom, whatsapp:A.whatsapp, email:A.email },
        rentila: { lease_id: +A.lease || null, property_id: +A.property || null },
        proprete: A.clean.split("\n").map(l => l.trim()).filter(Boolean).map(l => { const req = l.startsWith("*"); const [lb, h, ...ai] = l.replace(/^\*\s*/,"").split("|").map(x => x.trim()); return { label: lb, hint: h || "", required: req, ai: ai.join("|") }; }),
        refs: A.photos.map((ph,i) => ({ id: "p" + String(i+1).padStart(2,"0"), label: ph.label, hint: ph.hint, src: ph.src })),
        equipements: A.equip.split("\n").map(l => l.trim()).filter(Boolean).map(l => { const req = l.startsWith("*"); const [lb, h] = l.replace(/^\*\s*/,"").split("|").map(x => x.trim()); return { label: lb, hint: h || "", required: req }; }) }; };
    $("#dl").onclick = () => { const pk = build(); if(!pk) return; const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(pk)], {type:"application/json"})); a.download = pk.id + ".json"; a.click();
      toast("Déposez " + pk.id + ".json dans rooms/ — lien : …/?room=" + pk.id, 5000); };
    $("#ts").onclick = async () => { const pk = build(); if(!pk) return; await idb.set("pack:test", pk); location.href = location.pathname + "?test"; };
  };
  draw();
}

boot();
</script>
